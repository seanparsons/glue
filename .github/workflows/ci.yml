name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  nix-flake:
    name: Nix Flake (${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: [ ghc96, ghc98, ghc910, ghc912 ]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build and test ${{ matrix.ghc }}
        run: nix build -L .#${{ matrix.ghc }}-all
      - name: Check flake metadata
        if: matrix.ghc == 'ghc910'
        run: nix flake show
